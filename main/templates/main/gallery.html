{% extends "base.html" %}
{% load static %}

{% block title %}Gallery{% endblock %}

{% block extra_css %}
<!-- GLightbox CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
{% endblock %}

{% block content %}

<style>
/* Gallery CSS */
.gallery-section .container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

.gallery-section h1 {
    text-align: center;
    font-size: 3rem;
    margin-bottom: 40px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #222;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 30px;
}

.gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.gallery-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.4s ease;
}

.gallery-item:hover img {
    transform: scale(1.1);
}

.gallery-item .overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.7), rgba(0,0,0,0));
    color: #fff;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
    text-align: center;
}

.gallery-item:hover .overlay {
    opacity: 1;
}

.overlay h3 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 600;
}

.overlay p {
    font-size: 0.95rem;
    margin-top: 8px;
}

/* Responsive tweaks */
@media (max-width: 768px) {
    .gallery-section h1 {
        font-size: 2.2rem;
    }

    .gallery-item .overlay {
        padding: 15px;
    }
}
</style>

<div class="gallery-section">
    <div class="container">
        <h1>Our Gallery</h1>
        <div class="gallery-grid">
            {% for img in images %}
            <div class="gallery-item">
                <a href="{{ img.image.url }}" class="glightbox" data-title="{{ img.title }}">
                    <img src="{{ img.image.url }}" alt="{{ img.title }}">
                    <div class="overlay">
                        <h3>{{ img.title }}</h3>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<!-- GLightbox JS -->
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>
const lightbox = GLightbox({
    selector: '.glightbox',
    touchNavigation: true,
    loop: true,
    autoplayVideos: true,
});
</script>
{% endblock %}
