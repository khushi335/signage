{% extends "base.html" %}
{% block content %}
<div style="max-width: 600px; margin: 80px auto; text-align: center; padding: 40px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    <div style="width: 80px; height: 80px; background: #2ecc71; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 40px;">
        <i class="fas fa-check"></i>
    </div>
    <h1 style="color: #1a1a1a; margin-bottom: 10px;">Order Successful!</h1>
    <p style="color: #666; font-size: 18px;">Thank you, {{ user_info.name }}. Your order has been placed.</p>
    <div style="background: #f9f9f9; padding: 20px; border-radius: 10px; margin: 30px 0; text-align: left;">
        <p><strong>Order Number:</strong> #SIGN-{% now "YmdHi" %}</p>
        <p><strong>Estimated Delivery:</strong> {{ dates.standard }}</p>
        <p><strong>Shipping To:</strong> {{ user_info.address }}</p>
    </div>
    <a href="/" style="display: inline-block; padding: 15px 30px; background: #D4AF37; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">Return to Home</a>
</div>
{% endblock %}
